- id: "1"
  title: Snapshot format, full shared setup and first scenario
  description: >-
    Build the snapshot module, baseline + per-scenario diff goldens with missing-file recording, the
    separate query-count file and the full shared setup (every S-id), proven end-to-end by G1.01
    (SPEC CAP-1, CAP-2, CAP-3, CAP-7). The goal is to confirm the golden format reads well before
    scenarios are added.
  spec_checkpoint: true
  done_checkpoint: true
  invoke_dev_with: &dev_notes >-
    No commits; work on the currently active branch, even if it changed since planning.
    Run tests with ./run-tests.sh <label> from the repo root. After changes run make pretty and make lint.
    No automatic code review; review only when the user explicitly asks.
