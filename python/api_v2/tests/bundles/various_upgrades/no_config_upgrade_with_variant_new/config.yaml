---
- type: cluster
  name: cluster_with_variant_in_upgrade
  version: 2.1
  upgrade:
    - name: upgrade
      versions: &id001
        min: '1.0'
        max: '2.0'
      states: &id002
        available: any
    - name: upgrade_via_action_complex
      versions: *id001
      states: *id002
      scripts:
        - name: pre
          script: ./playbook.yaml
          script_type: ansible
        - name: switch
          script: bundle_switch
          script_type: internal
        - name: post
          script: ./playbook.yaml
          script_type: ansible
      config:
        - name: simple
          type: string
          required: false
        - name: grouped
          type: group
          subs:
            - name: simple
              type: integer
              default: 4
            - name: second
              type: float
              default: 4.3
            - name: pick_host
              required: false
              source:
                name: host_in_cluster
                type: builtin
              type: variant
        - name: after
          type: list
          default:
            - '1'
            - woohoo
        - name: pick_host
          required: false
          source:
            name: host_in_cluster
            type: builtin
          type: variant
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: dummy
  version: 3
