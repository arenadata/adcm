---
- type: cluster
  name: test_cluster
  display_name: TestCluster
  version: '4'
  edition: community
  config_group_customization: true
  actions:
    action_step_config:
      wizard_template:
        file:
          path: wizard_jinja/stage_config_step.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: action_step_config
          script: wizard_jinja/scripts/sleep.yaml
          script_type: ansible
    action_step_operation:
      wizard_template:
        file:
          path: wizard_jinja/stage_operational_step.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: action_step_operation
          script: wizard_jinja/scripts/sleep.yaml
          script_type: ansible
    action_step_mapping:
      wizard_template:
        file:
          path: wizard_jinja/stage_mapping_step.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: action_step_mapping
          script: wizard_jinja/scripts/sleep.yaml
          script_type: ansible
    action_no_desc:
      wizard_template:
        file:
          path: wizard_jinja/stage_config_step_no_desc.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: action_no_desc
          script: wizard_jinja/scripts/sleep.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- name: main_service
  display_name: MainService
  type: service
  version: '1'
  config_group_customization: true
  components:
    first_component:
      display_name: FirstComponent
      constraint:
        - 1
        - +
      config_group_customization: true
