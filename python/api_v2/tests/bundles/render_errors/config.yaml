---
- type: cluster
  name: cluster
  version: 1
  contract_version: '2.1'
  venv: '2.16'
  actions:
    error_render_yaml_scripts:
      scripts_template: &id002
        engine: &id001
          type: jinja2
        file:
          path: templates/render_error.yaml
      masking: {}
    error_render_py_scripts:
      scripts_template: &id003
        engine: &id006
          type: python
        file:
          path: templates/render_error.py
          entrypoint: main
      masking: {}
    error_syntax_yaml_scripts:
      scripts_template: &id005
        engine: *id001
        file:
          path: templates/syntax_error.yaml
      masking: {}
    error_render_yaml_config:
      config_template: *id002
      masking: {}
      scripts: &id004
        - name: aa
          script: woo.yaml
          script_type: ansible
    error_render_py_config:
      config_template: *id003
      masking: {}
      scripts: *id004
    error_syntax_yaml_config:
      config_template: *id005
      masking: {}
      scripts: *id004
    error_render_yaml_wizard:
      wizard_template: *id002
      masking: {}
      scripts: *id004
    error_render_py_wizard:
      wizard_template: *id003
      masking: {}
      scripts: *id004
    error_syntax_yaml_wizard:
      wizard_template: *id005
      masking: {}
      scripts: *id004
    error_missing_file_step_config:
      wizard_template:
        engine: *id001
        file:
          path: templates/stage_missing_file.yaml
      masking: {}
      scripts: *id004
    error_syntax_py_step_mapping:
      wizard_template:
        engine: *id006
        file:
          path: templates/stage_syntax_err_mapping.py
          entrypoint: render
      masking: {}
      scripts: *id004
    error_render_yaml_step_mapping:
      wizard_template:
        engine: *id001
        file:
          path: ./templates/stage_render_err_mapping.yaml
      masking: {}
      scripts: *id004
