---
- type: cluster
  name: cluster_two
  version: '1.0'
  edition: community
  config_group_customization: true
  allow_maintenance_mode: false
  config: &id001
    - name: string
      type: string
      required: false
      default: string
    - name: group
      type: group
      subs:
        - name: string
          type: string
          required: false
          default: string
  import:
    NonExistentCluster:
      versions:
        min: 1.0
        max: 2.0
  contract_version: '2.1'
  venv: '2.16'
- name: service
  type: service
  version: '1.0'
  config: *id001
  components:
    component:
      constraint:
        - 0
        - +
      config: *id001
  export:
    - string
