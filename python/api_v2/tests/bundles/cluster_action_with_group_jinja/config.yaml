---
- type: cluster
  name: dummy
  display_name: dummy
  description: dummy
  version: 1.0.0
  edition: enterprise
  allow_maintenance_mode: true
  venv: '2.16'
  config:
    - name: test_action_with_jinja_conf
      type: list
      required: false
      default: []
      ui_options:
        invisible: true
  actions:
    test_action_group:
      display_name: Test action with jinja group
      allow_to_terminate: true
      allow_in_maintenance_mode: true
      states:
        available:
          - created
      scripts:
        - name: test_action_group
          script: ./group_test_action.yaml
          script_type: ansible
      config_template:
        file:
          path: ./group_test.j2
        engine:
          type: jinja2
  contract_version: '2.1'
- type: service
  name: service_name
  display_name: service_name
  version: 1.0.0
  flag_autogeneration:
    enable_outdated_config: true
  actions:
    test_action_group_service:
      display_name: Test action with jinja group
      allow_to_terminate: true
      allow_in_maintenance_mode: true
      states:
        available:
          - created
      scripts:
        - name: test_action_group_service
          script: ./group_test_action.yaml
          script_type: ansible
      config_template:
        file:
          path: ./group_service_test.j2
        engine:
          type: jinja2
  components:
    server:
      display_name: Server
      constraint:
        - 1
        - +
      actions:
        test_action_group_component:
          display_name: Test action with jinja group
          allow_to_terminate: true
          allow_in_maintenance_mode: true
          states:
            available:
              - created
          scripts:
            - name: test_action_group_component
              script: ./group_test_action.yaml
              script_type: ansible
          config_template:
            file:
              path: ./group_component_test.j2
            engine:
              type: jinja2
