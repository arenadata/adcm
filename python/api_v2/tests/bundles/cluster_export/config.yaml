---
- type: cluster
  name: cluster_export
  version: '1.0'
  config:
    - name: gfe
      type: group
      subs:
        - name: plain
          type: string
          default: pt
        - name: sec
          type: password
          default: very_secret
        - name: secmap
          type: secretmap
          default:
            a: vs
  export:
    - gfe
  contract_version: '2.1'
  venv: '2.16'
- name: service_export
  type: service
  version: '1.0'
  config:
    - name: text
      type: text
      required: false
      default: text
  export:
    - text
