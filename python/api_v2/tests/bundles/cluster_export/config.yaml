---
- type: cluster
  name: cluster_export
  version: &version '1.0'
  config:
    - name: gfe
      type: group
      subs:
        - name: plain
          type: string
          default: pt
        - name: sec
          type: password
          default: very_secret
        - name: secmap
          type: secretmap
          default:
            a: vs

  export:
    - gfe

- name: service_export
  type: service
  version: *version
  config:
    - name: text
      type: text
      required: false
      default: text
  export:
    - text
