---
- type: cluster
  name: config_jinja_full
  version: '1.0'
  config:
    - name: boolean
      type: boolean
      required: false
      default: true
    - name: string
      type: string
      required: false
      default: string
    - name: password
      type: password
      required: false
      default: password
    - name: text
      type: text
      required: false
      default: text
  actions:
    check_state:
      states: &id001
        on_success: created
        available: any
      scripts:
        - name: check_state
          script: ./actions.yaml
          script_type: ansible
          params: &id002
            ansible_tags: ok
      config_template:
        file:
          path: config_jinja_state.jinja2
        engine:
          type: jinja2
    check_param:
      states:
        on_success: created
        available: any
      scripts:
        - name: check_param
          script: ./actions.yaml
          script_type: ansible
          params:
            ansible_tags: sleep
      config_template:
        file:
          path: ./config_jinja_param.jinja2
        engine:
          type: jinja2
    check_multistate:
      states:
        on_success: created
        available: any
      scripts:
        - name: check_multistate
          script: ./actions.yaml
          script_type: ansible
          params:
            ansible_tags: sleep
      config_template:
        file:
          path: ./config_jinja_multistate.jinja2
        engine:
          type: jinja2
    check_numeric_min_max_param: &id003
      states:
        on_success: created
        available: any
      scripts:
        - name: check_numeric_min_max_param
          script: ./actions.yaml
          script_type: ansible
          params:
            ansible_tags: sleep
      config_template:
        file:
          path: ./config_jinja_numeric_min_max.jinja2
        engine:
          type: jinja2
    adcm_8330_conflicting_params: &id004
      states:
        available: any
      scripts:
        - name: adcm_8330_conflicting_params
          script: ./actions.yaml
          script_type: ansible
          params:
            ansible_tags: ok
            operation:
              - a
              - b
            services: very nice, awesome
            rules: not-a-list
            changes: not-a-list
    adcm_8330_conflicting_params_jinja: &id005
      states:
        available: any
      scripts_template:
        file:
          path: ./adcm_8330_conflicting_params.j2
        engine:
          type: jinja2
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: first_service
  version: '1.0'
  config:
    - name: string
      type: string
      required: false
      default: string
  actions:
    check_state:
      states: *id001
      scripts:
        - name: check_state
          script: ./actions.yaml
          script_type: ansible
          params: *id002
      config_template:
        file:
          path: ./config_jinja_state_service.jinja2
        engine:
          type: jinja2
    check_param:
      states: *id001
      scripts:
        - name: check_param
          script: ./actions.yaml
          script_type: ansible
          params: *id002
      config_template:
        file:
          path: ./config_jinja_param_service.jinja2
        engine:
          type: jinja2
    check_multistate:
      states: *id001
      scripts:
        - name: check_multistate
          script: ./actions.yaml
          script_type: ansible
          params: *id002
      config_template:
        file:
          path: ./config_jinja_multistate_service.jinja2
        engine:
          type: jinja2
  components:
    first_component:
      actions:
        check_state:
          states: *id001
          scripts:
            - name: check_state
              script: ./actions.yaml
              script_type: ansible
              params: *id002
          config_template:
            file:
              path: ./config_jinja_state_component.jinja2
            engine:
              type: jinja2
        check_param:
          states: *id001
          scripts:
            - name: check_param
              script: ./actions.yaml
              script_type: ansible
              params: *id002
          config_template:
            file:
              path: ./config_jinja_param_component.jinja2
            engine:
              type: jinja2
        check_multistate:
          states: *id001
          scripts:
            - name: check_multistate
              script: ./actions.yaml
              script_type: ansible
              params: *id002
          config_template:
            file:
              path: ./config_jinja_multistate_component.jinja2
            engine:
              type: jinja2
        check_numeric_min_max_param: *id003
        adcm_8330_conflicting_params: *id004
        adcm_8330_conflicting_params_jinja: *id005
