---
- type: cluster
  name: config_jinja_full
  version: &version '1.0'
  config:
    - name: boolean
      type: boolean
      required: false
      default: true
    - name: string
      type: string
      required: false
      default: string
    - name: password
      type: password
      required: false
      default: password
    - name: text
      type: text
      required: false
      default: text
  actions: &actions
    check_state: &job
      type: job
      script: ./actions.yaml
      script_type: ansible
      params:
        ansible_tags: ok
      config_jinja: config_jinja_state.jinja2
      states:
        on_success: created
        available: any

    check_param:
      type: job
      script: ./actions.yaml
      script_type: ansible
      params:
        ansible_tags: sleep
      states:
        on_success: created
        available: any
      config_jinja: ./config_jinja_param.jinja2

    check_multistate:
      type: job
      script: ./actions.yaml
      script_type: ansible
      params:
        ansible_tags: sleep
      states:
        on_success: created
        available: any
      config_jinja: ./config_jinja_multistate.jinja2

    check_numeric_min_max_param:
      type: job
      script: ./actions.yaml
      script_type: ansible
      params:
        ansible_tags: sleep
      states:
        on_success: created
        available: any
      config_jinja: ./config_jinja_numeric_min_max.jinja2

    # ADCM-8330: an ansible script's own (arbitrary) `params` must not be confused with
    # reserved internal-script param names during job retrieval on run - `operation`/`services`
    # (service_manage), `rules` (hc_apply), `changes` (config_apply) - regardless of static
    # (`scripts:`) or jinja-rendered (`scripts_jinja:`) script definition.
    adcm_8330_conflicting_params:
      type: job
      script: ./actions.yaml
      script_type: ansible
      params:
        ansible_tags: ok
        operation: ["a", "b"]
        services: "very nice, awesome"
        rules: "not-a-list"
        changes: "not-a-list"
      states:
        available: any

    adcm_8330_conflicting_params_jinja:
      type: task
      scripts_jinja: "./adcm_8330_conflicting_params.j2"
      states:
        available: any

- type: service
  name: first_service
  version: *version
  config: &config
    - name: string
      type: string
      required: false
      default: string
  actions:
    check_state:
      <<: *job
      config_jinja: ./config_jinja_state_service.jinja2
    check_param:
      <<: *job
      config_jinja: ./config_jinja_param_service.jinja2
    check_multistate:
      <<: *job
      config_jinja: ./config_jinja_multistate_service.jinja2

  components:
    first_component:
      actions:
        <<: *actions
        check_state:
          <<: *job
          config_jinja: ./config_jinja_state_component.jinja2
        check_param:
          <<: *job
          config_jinja: ./config_jinja_param_component.jinja2
        check_multistate:
          <<: *job
          config_jinja: ./config_jinja_multistate_component.jinja2
