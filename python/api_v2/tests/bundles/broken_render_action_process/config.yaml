---
- type: cluster
  name: broken_render_process_wizard
  version: '1.0'
  edition: community
  actions:
    broken_process:
      wizard_template:
        file:
          path: broken_process.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: broken_process
          script: playbook.yaml
          script_type: ansible
    broken_configuration_step:
      wizard_template:
        file:
          path: broken_configuration_step.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: broken_configuration_step
          script: playbook.yaml
          script_type: ansible
    broken_operation_step:
      wizard_template:
        file:
          path: broken_operation_step.j2
        engine:
          type: jinja2
      states: &id001
        available: any
      scripts:
        - name: broken_operation_step
          script: playbook.yaml
          script_type: ansible
    broken_second_step:
      wizard_template:
        file:
          path: second_step_broken.j2
        engine:
          type: jinja2
      states: *id001
      scripts:
        - name: broken_second_step
          script: playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
