---
- type: cluster
  name: verynice
  version: 4
  venv: '2.16'
  contract_version: '2.1'
  actions:
    host_action_xxx:
      host_action: true
      scripts: &id001
        - name: blahblah
          script: notexist.yaml
          script_type: ansible
      masking: &id002 {}
      config_template: &id003
        file:
          path: return_groups.yaml
        engine:
          type: jinja2
    action_host_group_xxx:
      host_action: false
      allow_for_action_host_group: true
      scripts: *id001
      masking: *id002
      config_template: *id003
