---
- type: cluster
  name: cluster_with_wizard_hc_apply
  version: &version '1.0'
  edition: community
  actions: &actions
    wizard_jinja:
      type: job
      script: ./sleep.yaml
      script_type: ansible
      wizard_template:
        file:
          path: stages.j2
        engine:
          type: jinja2
      states:
        available: any
    
  config: &config
    - name: float
      type: float
      required: false
      default: 0.1

- type: service
  name: service_1
  version: "0.1"

  actions:
    <<: *actions

  config: *config

  components:
    component_1:
      actions:
        <<: *actions
      config: *config