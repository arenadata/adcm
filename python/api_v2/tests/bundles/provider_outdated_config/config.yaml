---
- type: provider
  version: 10.2
  name: provider_pattern
  config_group_customization: true
  flag_autogeneration:
    enable_outdated_config: true
  config: &id001
    - name: string_param
      type: string
      default: some_default_value
    - name: int_param
      type: integer
      display_name: Some Int
      default: 12
  contract_version: '2.1'
  venv: '2.16'
- type: host
  version: 2.2
  name: simple_host
  config: *id001
