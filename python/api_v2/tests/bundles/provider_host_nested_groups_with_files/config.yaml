- type: provider
  version: 1.0
  name: provider_nested_groups

  config: &config
  - name: g1
    subs:
    - &file
      default: ./simple.txt
      name: file_field
      type: file
    - &secretfile
      default: ./secret.txt
      group_customization: true
      name: secretfile_field
      type: secretfile
    - name: g2
      subs:
      - name: g3
        subs:
        - *file
        - *secretfile
        type: group
      - *file
      - *secretfile
      type: group
    type: group
  - *file
  - *secretfile

- type: host
  version: 1.0
  name: simple_host

  config: *config
