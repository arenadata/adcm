---
- type: cluster
  name: cluster_one
  version: '2.5'
  edition: community
  config_group_customization: true
  license: ./EULA.txt
  upgrade:
    - name: upgrade
      versions: &id001
        min: '1.0'
        max: '2.0'
      states: &id002
        available: any
    - name: upgrade_via_action_simple
      versions: *id001
      states: *id002
      scripts: &id003
        - name: pre
          script: ./playbook.yaml
          script_type: ansible
        - name: switch
          script: bundle_switch
          script_type: internal
        - name: post
          script: ./playbook.yaml
          script_type: ansible
    - name: upgrade_via_action_complex
      versions: *id001
      states: *id002
      scripts: *id003
      config:
        - name: simple
          type: string
          required: false
        - name: grouped
          type: group
          subs:
            - name: simple
              type: integer
              default: 4
            - name: second
              type: float
              default: 4.3
        - name: after
          type: list
          default:
            - '1'
            - woohoo
      ui_options:
        disclaimer: Cool upgrade
    - name: unfit_version
      versions:
        min_strict: '0'
        max: '0.3'
      states: *id002
    - name: unfit_state
      versions: *id001
      states:
        available:
          - doesnotexist
  config: &id004
    - name: string
      type: string
      required: false
      default: string
    - name: group
      type: group
      subs:
        - name: string
          type: string
          required: false
          default: string
  actions:
    action: &id005
      states:
        available: any
      scripts:
        - name: action
          script: ./playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- name: service_1
  type: service
  version: '2.5'
  config: *id004
  license: license.txt
  actions:
    action: *id005
  components:
    component_1:
      constraint:
        - 1
        - +
      config: *id004
      actions:
        action_1_comp_1: *id005
        action_2_comp_1: *id005
    component_2:
      constraint:
        - 1
      config: *id004
      actions:
        action_1_comp_2: *id005
- name: service_2
  type: service
  version: '2.5'
  config: *id004
  actions:
    action_1_service_2: *id005
    action_2_service_2: *id005
- name: service_3_manual_add
  type: service
  version: '2.5'
  config: *id004
