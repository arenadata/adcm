---
- type: cluster
  name: cluster_with_hc_requirements
  version: '1.0'
  edition: community
  contract_version: '2.1'
  venv: '2.16'
- name: service_requires_service
  type: service
  version: '1.0'
  requires:
    - service: service_required
  components:
    component_1:
      constraint:
        - 0
        - +
- name: service_requires_component
  type: service
  version: '1.0'
  requires:
    - service: service_with_component_required
      component: required_component
  components:
    component_1:
      constraint:
        - 0
        - +
- name: service_no_requires
  type: service
  version: '1.0'
  components:
    component_1:
      constraint:
        - 0
        - +
- name: service_required
  type: service
  version: '1.0'
- name: service_with_component_required
  type: service
  version: '1.0'
  components:
    required_component:
      constraint:
        - 0
        - +
    not_required_component:
      constraint:
        - 0
        - +
- name: bound_target_service
  type: service
  version: '1.0'
  components:
    bound_target_component:
      constraint:
        - 0
        - +
- name: service_with_bound_component
  type: service
  version: '1.0'
  components:
    bound_component:
      constraint:
        - 0
        - +
- name: service_with_one_component_constraint
  type: service
  version: '1.0'
  components:
    one:
      constraint:
        - 1
- name: service_with_zero_one_component_constraint
  type: service
  version: '1.0'
  components:
    zero_one:
      constraint:
        - 0
        - 1
- name: service_with_one_two_component_constraint
  type: service
  version: '1.0'
  components:
    one_two:
      constraint:
        - 1
        - 2
- name: service_with_one_odd_component_constraint_1
  type: service
  version: '1.0'
  components:
    one_odd_first_variant:
      constraint:
        - 1
        - odd
- name: service_with_one_odd_component_constraint_2
  type: service
  version: '1.0'
  components:
    one_odd_second_variant:
      constraint:
        - odd
- name: service_with_zero_odd_component_constraint
  type: service
  version: '1.0'
  components:
    zero_odd:
      constraint:
        - 0
        - odd
- name: service_with_one_plus_component_constraint
  type: service
  version: '1.0'
  components:
    one_plus:
      constraint:
        - 1
        - +
- name: service_with_plus_component_constraint
  type: service
  version: '1.0'
  components:
    plus:
      constraint:
        - +
