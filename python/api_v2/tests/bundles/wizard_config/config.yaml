---
- type: cluster
  name: wizard_config
  version: '1.0'
  edition: community
  actions:
    wizard_jinja:
      wizard_template:
        file:
          path: wizard_jinja/stages.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: wizard_jinja
          script: wizard_jinja/scripts/sleep.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
