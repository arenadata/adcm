---
- type: cluster
  name: cluster_wizard_hc_broken_step
  version: &version '2.0'
  edition: community
  actions:
    wizard_first_step_broken:
      type: job
      script: ./sleep.yaml
      script_type: ansible
      ui_options:
        disclaimer: "Test message!"
      wizard_template:
        file:
          path: wizard_jinja/stages_hc_first_broken.j2
        engine:
          type: jinja2
      states:
        available: any
    wizard_second_step_broken:
      type: job
      script: ./sleep.yaml
      script_type: ansible
      wizard_template:
        file:
          path: wizard_jinja/stages_hc_second_broken.j2
        engine:
          type: jinja2
      states:
        available: any

  config: &config
    - name: float
      type: float
      required: false
      default: 0.1
  
- name: hdfs
  type: service
  version: *version
  config: *config
  components:
    datanode:
      config: *config
    namenode:
      config: *config

- name: monitoring
  type: service
  version: *version
  config: *config
  components:
    agent:
      config: *config
    control:
      config: *config