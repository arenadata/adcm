---
- type: cluster
  name: cluster_wizard_hc_broken_step
  version: '2.0'
  edition: community
  actions:
    wizard_first_step_broken:
      ui_options:
        disclaimer: Test message!
      wizard_template:
        file:
          path: wizard_jinja/stages_hc_first_broken.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: wizard_first_step_broken
          script: ./sleep.yaml
          script_type: ansible
    wizard_second_step_broken:
      wizard_template:
        file:
          path: wizard_jinja/stages_hc_second_broken.j2
        engine:
          type: jinja2
      states:
        available: any
      scripts:
        - name: wizard_second_step_broken
          script: ./sleep.yaml
          script_type: ansible
  config: &id001
    - name: float
      type: float
      required: false
      default: 0.1
  contract_version: '2.1'
  venv: '2.16'
- name: hdfs
  type: service
  version: '2.0'
  config: *id001
  components:
    datanode:
      config: *id001
    namenode:
      config: *id001
- name: monitoring
  type: service
  version: '2.0'
  config: *id001
  components:
    agent:
      config: *id001
    control:
      config: *id001
