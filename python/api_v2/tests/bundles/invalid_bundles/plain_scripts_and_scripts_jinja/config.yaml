---
- type: cluster
  name: cluster_with_plain_scripts_and_scripts_jinja
  version: '1'
  config: &id001
    - name: string
      type: string
      default: some string
  actions: &id002
    action_plain_scripts_and_scripts_jinja:
      allow_to_terminate: true
      scripts:
        - name: script_1
          display_name: Script 1
          script: ./playbook.yaml
          script_type: ansible
          allow_to_terminate: false
        - name: script_2
          display_name: Script 2
          script: ./playbook.yaml
          script_type: ansible
      states:
        available: any
      scripts_template:
        file:
          path: ./scripts.j2
        engine:
          type: jinja2
  contract_version: '2.1'
  venv: '2.16'
- name: service_one_component
  type: service
  version: '1'
  config: *id001
  actions: *id002
  components:
    component_1:
      constraint:
        - 0
        - +
      config: *id001
      actions: *id002
