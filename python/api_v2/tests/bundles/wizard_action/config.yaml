---
- type: cluster
  name: cluster_with_wizard
  version: &version '1.0'
  edition: community
  actions:
    wizard_jinja:
      type: job
      script: ./sleep.yaml
      script_type: ansible
      wizard_template:
        file:
          path: wizard_jinja/stages.j2
        engine:
          type: jinja2
      states:
        available: any
    
  config: &config
    - name: float
      type: float
      required: false
      default: 0.1
