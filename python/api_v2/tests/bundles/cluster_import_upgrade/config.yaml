---
- type: cluster
  name: cluster_import
  contract_version: '2.1'
  venv: '2.16'
  version: 2.0
  upgrade:
    - name: upgrade
      versions: &id001
        min: '1.0'
        max: '1.0'
      states: &id002
        available: any
    - name: upgrade_with_template
      versions: *id001
      states: *id002
      scripts_template:
        engine:
          type: jinja2
        file:
          path: set_context_to_debug.yaml
  actions:
    revert:
      masking: {}
      scripts:
        - name: revert
          script_type: internal
          script: bundle_revert
  config:
    - name: debug
      type: json
      required: false
    - name: boolean
      type: boolean
      default: true
    - name: group
      type: group
      subs:
        - name: string
          type: string
          default: string
- type: service
  name: service_import
  version: 2.0
  config:
    - name: string
      type: string
      default: string
- type: service
  name: service_import_2
  version: 2.0
  config:
    - name: string
      type: string
      default: string
- type: service
  name: staying_alive
  version: 2.0
