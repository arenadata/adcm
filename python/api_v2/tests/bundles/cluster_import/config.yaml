---
- type: cluster
  name: cluster_import
  version: 1.0
  import:
    cluster_export:
      versions:
        min: 1.0
        max: 2.0
    service_export:
      versions:
        min: 1.0
        max: 2.0
    not_exist:
      default:
        - group
  config:
    - name: boolean
      type: boolean
      default: true
    - name: group
      type: group
      subs:
        - name: string
          type: string
          default: string
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: service_import
  version: 1.0
  import:
    cluster_export:
      versions:
        min: 1.0
        max: 2.0
    service_export:
      versions:
        min: 1.0
        max: 2.0
  config:
    - name: string
      type: string
      default: string
- type: service
  name: service_import_2
  version: 1.0
  import:
    cluster_export:
      versions:
        min: 1.0
        max: 2.0
    service_export:
      versions:
        min: 1.0
        max: 2.0
  config:
    - name: string
      type: string
      default: string
- type: service
  name: staying_alive
  version: 1.0
  import:
    service_export:
      required: true
      versions:
        min: 1.0
        max: 2.0
