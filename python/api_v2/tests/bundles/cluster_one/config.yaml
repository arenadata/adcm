---
- type: cluster
  name: cluster_one
  version: '1.0'
  edition: community
  config_group_customization: true
  license: EULA.txt
  allow_maintenance_mode: true
  flag_autogeneration:
    enable_outdated_config: true
  config: &id008
    - name: boolean
      type: boolean
      default: true
    - name: group
      type: group
      subs:
        - name: float
          type: float
          required: false
          default: 0.1
    - name: variant_not_strict
      type: variant
      required: false
      source:
        type: config
        strict: false
        name: list
      default: value1
    - name: list
      type: list
      required: false
      default:
        - value1
        - value2
        - value3
    - name: activatable_group
      type: group
      activatable: true
      active: true
      subs:
        - name: integer
          type: integer
          required: false
          default: 10
  actions:
    action: &id002
      allow_to_terminate: true
      allow_for_action_host_group: true
      states: &id001
        available: any
      scripts:
        - name: action
          script: ./playbook.yaml
          script_type: ansible
    with_config:
      config:
        - name: simple
          type: string
          required: false
        - name: grouped
          type: group
          subs:
            - name: simple
              type: integer
              default: 4
            - name: second
              type: float
              default: 4.3
        - name: after
          type: list
          default:
            - '1'
            - woohoo
        - name: activatable_group
          type: group
          activatable: true
          active: true
          subs:
            - name: text
              type: text
              default: text
      allow_to_terminate: true
      allow_for_action_host_group: true
      states: *id001
      scripts:
        - name: with_config
          script: ./playbook.yaml
          script_type: ansible
    with_hc:
      allow_in_maintenance_mode: true
      hc_acl:
        - action: add
          service: service_1
          component: component_1
        - action: remove
          service: service_1
          component: component_2
      allow_to_terminate: true
      allow_for_action_host_group: true
      states: *id001
      scripts:
        - name: with_hc
          script: ./playbook.yaml
          script_type: ansible
    cluster_on_host: &id003
      allow_for_action_host_group: false
      host_action: true
      allow_to_terminate: true
      states: *id001
      scripts:
        - name: cluster_on_host
          script: ./playbook.yaml
          script_type: ansible
  export:
    - boolean
  contract_version: '2.1'
  venv: '2.16'
- name: service_1
  type: service
  version: '1.0'
  config: &id004
    - name: string
      type: string
      required: false
      default: string
    - name: group
      type: group
      subs:
        - name: password
          type: password
          default: password
    - name: activatable_group
      type: group
      activatable: true
      active: true
      subs:
        - name: text
          type: text
          required: false
          default: text
  license: EULA.txt
  actions: &id005
    action: *id002
    service_on_host: *id003
  import: &id006
    service:
      versions:
        min: 0.9
        max: 1.1
  components: &id007
    component_1:
      constraint:
        - 0
        - +
      config:
        - name: secrettext
          type: secrettext
          default: secrettext
        - name: group
          type: group
          subs:
            - name: file
              type: file
              required: false
              default: ./file.txt
        - name: activatable_group
          type: group
          activatable: true
          active: true
          subs:
            - name: secretfile
              type: secretfile
              default: ./secretfile.txt
      actions:
        action_1_comp_1: *id002
        action_2_comp_1: *id002
        component_on_host: *id003
    component_2:
      constraint:
        - 0
        - +
      actions:
        action_1_comp_2: *id002
      config:
        - name: string_field
          type: string
          default: string value
    component_3:
      constraint:
        - 0
        - +
      config:
        - name: string_field
          type: string
          default: string value
- name: service_2
  type: service
  version: '1.0'
  config:
    - name: string_field
      type: string
      default: string value
    - name: group
      type: group
      subs:
        - type: json
          name: json
          required: false
          display_name: Pretty JSON
  actions:
    action_1_service_2: *id002
    action_2_service_2: *id002
- name: service_3_manual_add
  type: service
  version: '1.0'
- name: service_4_save_config_without_required_field
  type: service
  version: '1.0'
  config:
    - name: map_not_required
      type: map
      required: false
    - name: variant_not_required
      type: variant
      required: false
      source:
        type: config
        strict: false
        name: list
    - name: list
      type: list
      required: false
      default:
        - value1
        - value2
    - name: group
      type: group
      subs:
        - name: map_not_required
          type: map
          required: false
        - name: variant_not_required
          type: variant
          required: false
          source:
            type: config
            strict: false
            name: list
- name: service_5_variant_type_without_values
  type: service
  version: '1.0'
  config:
    - name: variant
      type: variant
      required: false
      source:
        type: builtin
        strict: true
        name: host_in_cluster
- name: adcm_8014_8016
  type: service
  version: '1.0'
  config:
    - name: option_no_req_def
      type: option
      option:
        value1: value1
        value2: value2
      default: value1
      required: false
    - name: variant_no_req_def
      type: variant
      source:
        type: inline
        strict: true
        value:
          - value1
          - value2
      default: value1
      required: false
    - name: variant_req_def
      type: variant
      source:
        type: inline
        strict: true
        value:
          - value1
          - value2
      default: value1
      required: true
    - name: structure_no_req_def
      type: structure
      yspec: ./structure.yaml
      default:
        string: value
      required: false
    - name: structure_list_no_req_def
      type: structure
      yspec: ./structure_list.yaml
      default:
        - string: value
      required: false
    - name: structure_dict_no_req_def
      type: structure
      yspec: ./structure.yaml
      default:
        string: value
      required: false
    - name: structure_req_def
      type: structure
      yspec: ./structure.yaml
      default:
        string: value
      required: true
- name: service_6_delete_with_action
  type: service
  version: '1004'
