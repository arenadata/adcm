---
- type: provider
  name: provider_with_actions
  version: 3
  actions:
    state_any: &id002
      states:
        available: any
      scripts:
        - name: state_any
          script: ./actions.yaml
          script_type: ansible
    state_created: &id003
      states:
        available:
          - created
      scripts:
        - name: state_created
          script: ./actions.yaml
          script_type: ansible
    state_installed: &id004
      states:
        available:
          - installed
      scripts:
        - name: state_installed
          script: ./actions.yaml
          script_type: ansible
    state_created_masking: &id005
      masking:
        state:
          available:
            - created
      scripts:
        - name: state_created_masking
          script: ./actions.yaml
          script_type: ansible
    state_installed_masking: &id006
      masking:
        state:
          available:
            - installed
      scripts:
        - name: state_installed_masking
          script: ./actions.yaml
          script_type: ansible
    state_created_unavailable: &id007
      masking:
        state:
          unavailable:
            - created
      scripts:
        - name: state_created_unavailable
          script: ./actions.yaml
          script_type: ansible
    multi_flag_masking: &id008
      masking:
        multi_state:
          available:
            - flag
      scripts:
        - name: multi_flag_masking
          script: ./actions.yaml
          script_type: ansible
    multi_flag_unavailable: &id009
      masking:
        multi_state:
          unavailable:
            - flag
      scripts:
        - name: multi_flag_unavailable
          script: ./actions.yaml
          script_type: ansible
    state_created_available_multi_bag_available: &id010
      masking:
        state:
          available:
            - created
        multi_state:
          available:
            - bag
      scripts:
        - name: state_created_available_multi_bag_available
          script: ./actions.yaml
          script_type: ansible
    state_created_available_multi_bag_unavailable: &id011
      masking:
        state:
          available:
            - created
        multi_state:
          unavailable:
            - bag
      scripts:
        - name: state_created_available_multi_bag_unavailable
          script: ./actions.yaml
          script_type: ansible
    state_created_unavailable_multi_bag_available: &id012
      masking:
        state:
          unavailable:
            - created
        multi_state:
          available:
            - bag
      scripts:
        - name: state_created_unavailable_multi_bag_available
          script: ./actions.yaml
          script_type: ansible
    state_created_unavailable_multi_bag_unavailable: &id013
      masking:
        state:
          unavailable:
            - created
        multi_state:
          unavailable:
            - bag
      scripts:
        - name: state_created_unavailable_multi_bag_unavailable
          script: ./actions.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- type: host
  version: 2
  name: host_with_actions
  actions:
    host_action_any: &id001
      states:
        available:
          - never
      scripts:
        - name: host_action_any
          script: ./actions.yaml
          script_type: ansible
    host_action_installed: *id001
    host_action_multi_flag: *id001
    state_any: *id002
    state_created: *id003
    state_installed: *id004
    state_created_masking: *id005
    state_installed_masking: *id006
    state_created_unavailable: *id007
    multi_flag_masking: *id008
    multi_flag_unavailable: *id009
    state_created_available_multi_bag_available: *id010
    state_created_available_multi_bag_unavailable: *id011
    state_created_unavailable_multi_bag_available: *id012
    state_created_unavailable_multi_bag_unavailable: *id013
