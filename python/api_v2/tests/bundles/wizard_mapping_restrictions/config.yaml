---
- type: cluster
  name: wizard_mapping_with_restrictions
  version: '1.0'
  edition: community
  allow_maintenance_mode: true
  actions:
    action_c_one:
      states: &id002
        available: any
      wizard_template:
        file:
          path: stages/constraint_one/stages.j2
        engine: &id001
          type: jinja2
      scripts:
        - name: action_c_one
          script: ./sleep.yaml
          script_type: ansible
    action_c_one_odd_first_variant:
      wizard_template:
        file:
          path: stages/constraint_one_odd_first_variant/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_c_one_odd_first_variant
          script: ./sleep.yaml
          script_type: ansible
    action_c_one_odd_second_variant:
      wizard_template:
        file:
          path: stages/constraint_one_odd_second_variant/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_c_one_odd_second_variant
          script: ./sleep.yaml
          script_type: ansible
    action_c_one_plus:
      wizard_template:
        file:
          path: stages/constraint_one_plus/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_c_one_plus
          script: ./sleep.yaml
          script_type: ansible
    action_c_one_two:
      wizard_template:
        file:
          path: stages/constraint_one_two/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_c_one_two
          script: ./sleep.yaml
          script_type: ansible
    action_c_plus:
      wizard_template:
        file:
          path: stages/constraint_plus/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_c_plus
          script: ./sleep.yaml
          script_type: ansible
    action_c_zero_odd:
      wizard_template:
        file:
          path: stages/constraint_zero_odd/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_c_zero_odd
          script: ./sleep.yaml
          script_type: ansible
    action_c_zero_one:
      wizard_template:
        file:
          path: stages/constraint_zero_one/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_c_zero_one
          script: ./sleep.yaml
          script_type: ansible
    action_two_mapping_steps:
      wizard_template:
        file:
          path: stages/two_mapping_steps/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_two_mapping_steps
          script: ./sleep.yaml
          script_type: ansible
    action_service_requires_service:
      wizard_template:
        file:
          path: stages/service_requires_service/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_service_requires_service
          script: ./sleep.yaml
          script_type: ansible
    action_service_requires_component:
      wizard_template:
        file:
          path: stages/service_requires_component/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_service_requires_component
          script: ./sleep.yaml
          script_type: ansible
    action_bound_component:
      wizard_template:
        file:
          path: stages/bound_component/stages.j2
        engine: *id001
      states: *id002
      scripts:
        - name: action_bound_component
          script: ./sleep.yaml
          script_type: ansible
  config:
    - name: float
      type: float
      required: false
      default: 0.1
  contract_version: '2.1'
  venv: '2.16'
- name: service_requires_service
  type: service
  version: '1.0'
  requires:
    - service: service_required
  components:
    component_1:
      constraint:
        - 0
        - +
- name: service_requires_component
  type: service
  version: '1.0'
  requires:
    - service: service_with_component_required
      component: required_component
  components:
    component_1:
      constraint:
        - 0
        - +
- name: service_no_requires
  type: service
  version: '1.0'
  components:
    component_1:
      constraint:
        - 0
        - +
- name: service_required
  type: service
  version: '1.0'
- name: service_with_component_required
  type: service
  version: '1.0'
  components:
    required_component:
      constraint:
        - 0
        - +
    not_required_component:
      constraint:
        - 0
        - +
- name: bound_target_service
  type: service
  version: '1.0'
  components:
    bound_target_component:
      constraint:
        - 0
        - +
- name: service_with_bound_component
  type: service
  version: '1.0'
  components:
    bound_component:
      constraint:
        - 0
        - +
- name: service_with_one_component_constraint
  type: service
  version: '1.0'
  components:
    one:
      constraint:
        - 1
- name: service_with_zero_one_component_constraint
  type: service
  version: '1.0'
  components:
    zero_one:
      constraint:
        - 0
        - 1
- name: service_with_one_two_component_constraint
  type: service
  version: '1.0'
  components:
    one_two:
      constraint:
        - 1
        - 2
- name: service_with_one_odd_component_constraint_1
  type: service
  version: '1.0'
  components:
    one_odd_first_variant:
      constraint:
        - 1
        - odd
- name: service_with_one_odd_component_constraint_2
  type: service
  version: '1.0'
  components:
    one_odd_second_variant:
      constraint:
        - odd
- name: service_with_zero_odd_component_constraint
  type: service
  version: '1.0'
  components:
    zero_odd:
      constraint:
        - 0
        - odd
- name: service_with_one_plus_component_constraint
  type: service
  version: '1.0'
  components:
    one_plus:
      constraint:
        - 1
        - +
- name: service_with_plus_component_constraint
  type: service
  version: '1.0'
  components:
    plus:
      constraint:
        - +
