---
- type: cluster
  name: cluster_with_action_params
  display_name: cluster_with_action_params
  version: '1.0'
  edition: community
  config_group_customization: true
  actions: &id001
    action_full:
      allow_to_terminate: true
      states:
        available: any
      scripts:
        - name: action_full
          script: ./sleep.yaml
          script_type: ansible
          params:
            ansible_tags: ansible_tag1, ansible_tag2
            jinja2_native: true
            custom_str: custom_str_value
            custom_list:
              - 1
              - two
              - 3.0
            custom_map:
              1: two
              three: 4.0
              five: 6
    action_jinja2Native_false:
      allow_to_terminate: true
      states:
        available: any
      scripts:
        - name: action_jinja2Native_false
          script: ./sleep.yaml
          script_type: ansible
          params:
            ansible_tags: ansible_tag1, ansible_tag2
            jinja2_native: false
            custom_str: custom_str_value
            custom_list:
              - 1
              - two
              - 3.0
            custom_map:
              1: two
              three: 4.0
              five: 6
    action_jinja2Native_absent:
      allow_to_terminate: true
      states:
        available: any
      scripts:
        - name: action_jinja2Native_absent
          script: ./sleep.yaml
          script_type: ansible
          params:
            ansible_tags: ansible_tag1, ansible_tag2
            custom_str: custom_str_value
            custom_list:
              - 1
              - two
              - 3.0
            custom_map:
              1: two
              three: 4.0
              five: 6
    action_ansibleTags_absent:
      allow_to_terminate: true
      states:
        available: any
      scripts:
        - name: action_ansibleTags_absent
          script: ./sleep.yaml
          script_type: ansible
          params:
            jinja2_native: true
            custom_str: custom_str_value
            custom_list:
              - 1
              - two
              - 3.0
            custom_map:
              1: two
              three: 4.0
              five: 6
    action_customFields_absent:
      allow_to_terminate: true
      states:
        available: any
      scripts:
        - name: action_customFields_absent
          script: ./sleep.yaml
          script_type: ansible
          params:
            ansible_tags: ansible_tag1, ansible_tag2
            jinja2_native: true
  config:
    - name: string
      type: string
      required: false
      default: string
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: same_actioned_service
  version: 2
  actions: *id001
  components:
    same_actions:
      actions: *id001
