---
- type: cluster
  version: 10
  name: secret_config
  display_name: secret_config
  upgrade:
    - name: '10'
      from_edition:
        - community
      versions:
        min: 0.0.0
        max_strict: 10.0.0
      states:
        available: any
  config:
    - name: secret_map
      type: secretmap
      group_customization: true
  actions:
    action:
      display_name: adcm_config usage action
      scripts:
        - name: some_script
          script: ./action.yaml
          script_type: ansible
      states:
        available: any
  contract_version: '2.1'
  venv: '2.16'
