---
- type: cluster
  name: various_paths
  version: 42
  config: &id001
    - name: control
      type: text
      default: stuff
    - name: no_default_p
      type: file
    - name: no_default_s
      type: secretfile
    - name: relative_plain
      type: file
      default: ./nicename.txt
    - name: full_plain
      type: file
      default: nicename.txt
    - name: relative_secret
      type: secretfile
      default: ./nicename.txt
    - name: full_secret
      type: secretfile
      default: nicename.txt
    - name: relative_inside_plain
      type: file
      default: ./inside/common.txt
    - name: full_inside_secret
      type: secretfile
      default: inside/common.txt
    - name: relative_complex
      type: structure
      yspec: ./schema.yaml
    - name: full_complex
      type: structure
      yspec: schema.yaml
    - name: relative_inside_complex
      type: structure
      yspec: ./inside/struct.yaml
    - name: full_inside_complex
      type: structure
      yspec: inside/struct.yaml
  actions: &id002
    as_job_relative:
      scripts:
        - name: as_job_relative
          script: ./action.yaml
          script_type: ansible
      config_template:
        file:
          path: ./conf.j2
        engine:
          type: jinja2
    as_job_full:
      scripts:
        - name: as_job_full
          script: action.yaml
          script_type: python
      config_template:
        file:
          path: conf.j2
        engine:
          type: jinja2
    as_job_inner_relative:
      scripts:
        - name: as_job_inner_relative
          script: ./inside/action.yaml
          script_type: python
      config_template:
        file:
          path: ./inside/conf.j2
        engine:
          type: jinja2
    as_job_inner_full:
      scripts:
        - name: as_job_inner_full
          script: inside/action.yaml
          script_type: ansible
      config_template:
        file:
          path: inside/conf.j2
        engine:
          type: jinja2
    as_task_config_relative:
      scripts:
        - name: rel_1
          script_type: python
          script: ./action.yaml
        - name: rel_2
          script_type: ansible
          script: action.yaml
      config_template:
        file:
          path: ./conf.j2
        engine:
          type: jinja2
    as_task_config_inside_full:
      scripts:
        - name: full_one
          script_type: python
          script: inside/action.yaml
        - name: full_two
          script_type: ansible
          script: ./inside/action.yaml
      config_template:
        file:
          path: inside/conf.j2
        engine:
          type: jinja2
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: alongside_the_cluster
  version: 2.3
  config:
    - name: grouped
      type: group
      subs: *id001
  actions: *id002
  components:
    alongside_cluster:
      config: *id001
      actions: *id002
