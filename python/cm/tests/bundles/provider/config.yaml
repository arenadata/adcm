---
- type: provider
  name: provider
  version: '1.0'
  config_group_customization: true
  config: &id001
    - name: integer
      type: integer
      required: false
      default: 10
    - name: password
      type: password
      required: false
      default: password
    - name: string
      type: string
      required: false
      default: string
    - name: list
      type: list
      required: false
      default:
        - value1
        - value2
        - value3
  actions:
    action_on_provider: &id002
      states:
        available: any
      scripts:
        - name: action_on_provider
          script: ./playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- type: host
  name: host
  version: '1.0'
  config: *id001
  actions:
    action_on_host: *id002
