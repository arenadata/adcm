---
- type: cluster
  version: 3
  name: with_jinja_config
  actions:
    with_j2_config:
      masking: {}
      scripts:
        - name: with_j2_config
          script: action.yaml
          script_type: ansible
      config_template:
        file:
          path: outer/configs/config_1.j2
        engine:
          type: jinja2
  contract_version: '2.1'
  venv: '2.16'
