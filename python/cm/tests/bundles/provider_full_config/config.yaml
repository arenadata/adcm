---
- type: provider
  name: with_all_config_params_provider
  version: 1.0
  config: &id001
    - type: boolean
      name: boolean
      required: false
    - type: integer
      name: integer
      required: false
    - type: float
      name: float
      required: false
    - type: string
      name: string
      required: false
    - type: text
      name: text
      required: false
    - type: secrettext
      name: secrettext
      required: false
    - type: password
      name: password
      required: false
    - type: map
      name: map
      required: false
    - type: secretmap
      name: secretmap
      required: false
    - type: json
      name: json
      required: false
    - type: list
      name: list
      required: false
    - type: file
      name: file
      required: false
    - type: secretfile
      name: secretfile
      required: false
    - name: source_list
      type: list
      default:
        - ok
        - fail
    - name: variant_config
      required: false
      type: variant
      source:
        type: config
        name: source_list
    - name: variant_inline
      type: variant
      required: false
      source:
        type: inline
        value:
          - f
          - c
    - name: variant_builtin
      type: variant
      required: false
      source:
        type: builtin
        name: host_not_in_clusters
    - name: plain_group
      type: group
      subs:
        - name: simple
          type: string
          required: false
        - name: map
          type: map
          required: false
        - name: file
          type: file
          required: false
        - name: listofstuff
          type: list
          required: false
    - name: activatable_group
      type: group
      activatable: true
      active: false
      subs:
        - name: simple
          type: string
          required: false
        - name: list
          type: list
          required: false
  actions: &id003
    dummy:
      states: &id002
        available: any
      scripts:
        - name: dummy
          script: ./playbook.yaml
          script_type: ansible
    with_config:
      config: *id001
      states: *id002
      scripts:
        - name: with_config
          script: ./playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- type: host
  name: all_params_host
  version: 1.1
  actions: *id003
  config: *id001
