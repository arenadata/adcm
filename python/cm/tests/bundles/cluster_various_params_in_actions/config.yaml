---
- type: cluster
  version: 2.3
  name: cluster_with_various_params_in_action
  actions:
    job_no_params:
      scripts:
        - name: job_no_params
          script: ./somewhere.yaml
          script_type: ansible
    job_params:
      scripts:
        - name: job_params
          script: ./somewhere.yaml
          script_type: ansible
          params:
            ansible_tags: hello, there
            custom:
              - 4
              - 3
    task_no_params:
      scripts:
        - name: first
          script: ./somewhere.yaml
          script_type: ansible
        - name: second
          script: ./somewhere.yaml
          script_type: ansible
    task_params_in_action:
      scripts:
        - name: first
          script: ./somewhere.yaml
          script_type: ansible
        - name: second
          script: ./somewhere.yaml
          script_type: ansible
    task_params_in_action_and_scripts:
      scripts:
        - name: first
          script: ./somewhere.yaml
          script_type: ansible
          params:
            ansible_tags: one, two
            jinja2_native: hello
        - name: second
          script: ./somewhere.yaml
          script_type: ansible
    task_params_in_action_and_all_scripts:
      scripts:
        - name: first
          script: ./somewhere.yaml
          script_type: ansible
          params:
            ansible_tags: one, two
            jinja2_native: hello
        - name: second
          script: ./somewhere.yaml
          script_type: ansible
          params:
            perfect: thing
    task_params_in_scripts:
      scripts:
        - name: first
          script: ./somewhere.yaml
          script_type: ansible
          params:
            ansible_tags: one
        - name: second
          params:
            perfect: thing
          script: ./somewhere.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
