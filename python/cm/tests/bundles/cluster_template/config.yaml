---
- type: cluster
  name: with_templates
  version: 1.0
  actions:
    with_templates:
      scripts_template:
        file:
          path: templates/scripts.py
          entrypoint: get_scripts
        engine:
          type: python
      config_template:
        file:
          path: templates/config.j2
        engine:
          type: jinja2
      masking: {}
  contract_version: '2.1'
  venv: '2.16'
