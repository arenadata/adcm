---
- type: cluster
  name: cluster_1
  version: '2.0'
  edition: community
  config_group_customization: true
  allow_maintenance_mode: true
  upgrade:
    - name: upgrade
      versions: &id001
        min: '1.0'
        max: '2.0'
      states: &id002
        available: any
    - name: upgrade_via_action_simple
      versions: *id001
      states: *id002
      scripts: &id003
        - name: pre
          script: ./playbook.yaml
          script_type: ansible
        - name: switch
          script: bundle_switch
          script_type: internal
        - name: post
          script: ./playbook.yaml
          script_type: ansible
    - name: upgrade_via_action_complex
      versions: *id001
      states: *id002
      scripts: *id003
      config:
        - name: simple
          type: string
          required: false
        - name: grouped
          type: group
          subs:
            - name: simple
              type: integer
              default: 4
            - name: second
              type: float
              default: 4.3
        - name: after
          type: list
          default:
            - '1'
            - woohoo
      ui_options:
        disclaimer: Cool upgrade
    - name: unfit_version
      versions:
        min_strict: '0'
        max: '0.3'
      states: *id002
    - name: unfit_state
      versions: *id001
      states:
        available:
          - doesnotexist
  config: &id005
    - name: integer
      type: integer
      required: false
      default: 100
    - name: string
      type: string
      required: false
      default: string
    - name: list
      type: list
      required: false
      default:
        - value1
        - value2
        - value3
  actions:
    action_on_cluster: &id006
      states: &id004
        available: any
      scripts:
        - name: action_on_cluster
          script: ./playbook.yaml
          script_type: ansible
    host_action_on_cluster: &id007
      host_action: true
      states:
        available: any
      scripts:
        - name: host_action_on_cluster
          script: ./playbook.yaml
          script_type: ansible
    hc_acl_action_on_cluster: &id008
      hc_acl:
        - service: service_two_components
          component: component_1
          action: add
        - service: service_two_components
          component: component_1
          action: remove
        - service: service_two_components
          component: component_2
          action: add
        - service: service_two_components
          component: component_2
          action: remove
      states: *id004
      scripts:
        - name: hc_acl_action_on_cluster
          script: ./playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- name: service_one_component
  type: service
  version: '2.0'
  config: *id005
  actions:
    action_on_service: *id006
    host_action_on_service: *id007
  components:
    component_1:
      constraint:
        - 0
        - +
      config: *id005
      actions:
        action_on_component: *id006
        host_action_on_component: *id007
- name: service_two_components
  type: service
  version: '2.0'
  config: *id005
  actions:
    action_on_service: *id006
    hc_acl_action_on_service: *id008
  components:
    component_1:
      constraint:
        - 0
        - +
      config: *id005
      actions:
        action_on_component_1: *id006
    component_2:
      constraint:
        - 0
        - +
      config: *id005
      actions:
        action_on_component_2: *id006
- name: another_service_two_components
  type: service
  version: '2.0'
  config: *id005
  actions: &id009
    action_on_service: *id006
  components: &id010
    component_1:
      constraint:
        - 0
        - +
      config: *id005
      actions:
        action_on_component_1: *id006
    component_2:
      constraint:
        - 0
        - +
      config: *id005
      actions:
        action_on_component_2: *id006
- name: another_service_two_components_2
  components:
    component_1:
      constraint:
        - 0
        - +
      config:
        - name: integer
          type: integer
          required: false
          default: 10
        - name: plain
          type: file
          default: ./plain.txt
        - name: secte
          type: secretfile
          default: ./secret.txt
        - name: bunch
          type: group
          subs:
            - name: plain
              type: file
              default: ./plain.txt
            - name: secte
              type: secretfile
              default: ./secret.txt
      actions:
        action_on_component_1: *id006
    component_2:
      constraint:
        - 0
        - +
      config: *id005
      actions:
        action_on_component_2: *id006
  type: service
  version: '2.0'
  config: *id005
  actions: *id009
- name: another_service_two_components_3
  type: service
  version: '2.0'
  config: *id005
  actions: *id009
  components: *id010
