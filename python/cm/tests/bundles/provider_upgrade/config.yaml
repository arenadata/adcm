---
- type: provider
  name: provider
  version: '2.0'
  upgrade:
    - name: upgrade
      versions: &id001
        min: '1.0'
        max: '2.0'
      states: &id002
        available: any
    - name: upgrade_via_action_simple
      versions: *id001
      states: *id002
      scripts: &id003
        - name: pre
          script: ./playbook.yaml
          script_type: ansible
        - name: switch
          script: bundle_switch
          script_type: internal
        - name: post
          script: ./playbook.yaml
          script_type: ansible
    - name: upgrade_via_action_complex
      versions: *id001
      states: *id002
      scripts: *id003
      config:
        - name: simple
          type: string
          required: false
        - name: grouped
          type: group
          subs:
            - name: simple
              type: integer
              default: 4
            - name: second
              type: float
              default: 4.3
        - name: after
          type: list
          default:
            - '1'
            - woohoo
      ui_options:
        disclaimer: Cool upgrade
    - name: unfit_version
      versions:
        min_strict: '0'
        max: '0.3'
      states: *id002
    - name: unfit_state
      versions: *id001
      states:
        available:
          - doesnotexist
  actions:
    provider_action:
      states:
        available: any
      scripts:
        - name: provider_action
          script: ./playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- type: host
  name: host
  version: '2.0'
  actions:
    host_action:
      display_name: host_action
      states:
        available: any
      scripts:
        - name: host_action
          script: ./playbook.yaml
          script_type: ansible
