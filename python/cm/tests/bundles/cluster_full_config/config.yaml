---
- type: cluster
  name: with_all_config_params
  version: 1.0
  import:
    very_complex:
      multibind: true
    for_export:
      multibind: true
  config: &id001
    - type: boolean
      name: boolean
      required: false
    - type: integer
      name: integer
      required: false
    - type: float
      name: float
      required: false
    - type: string
      name: string
      required: false
    - type: text
      name: text
      required: false
    - type: secrettext
      name: secrettext
      required: false
    - type: password
      name: password
      required: false
    - type: map
      name: map
      required: false
    - type: secretmap
      name: secretmap
      required: false
    - type: json
      name: json
      required: false
    - type: list
      name: list
      required: false
    - type: file
      name: file
      required: false
    - type: secretfile
      name: secretfile
      required: false
    - name: source_list
      type: list
      default:
        - ok
        - fail
    - name: variant_config
      required: false
      type: variant
      source:
        type: config
        name: source_list
    - name: variant_inline
      type: variant
      required: false
      source:
        type: inline
        value:
          - f
          - c
    - name: variant_builtin
      type: variant
      required: false
      source:
        type: builtin
        name: host_in_cluster
    - name: plain_group
      type: group
      subs:
        - name: simple
          type: string
          required: false
        - name: map
          type: map
          required: false
        - name: file
          type: file
          required: false
        - name: listofstuff
          type: list
          required: false
    - name: activatable_group
      type: group
      activatable: true
      active: false
      subs:
        - name: simple
          type: string
          required: false
        - name: list
          type: list
          required: false
  actions: &id003
    dummy: &id004
      allow_for_action_host_group: true
      states: &id002
        available: any
      scripts:
        - name: dummy
          script: ./playbook.yaml
          script_type: ansible
    with_config: &id005
      config: *id001
      allow_for_action_host_group: true
      states: *id002
      scripts:
        - name: with_config
          script: ./playbook.yaml
          script_type: ansible
    with_config_on_host: &id006
      config: *id001
      allow_for_action_host_group: false
      host_action: true
      states: *id002
      scripts:
        - name: with_config_on_host
          script: ./playbook.yaml
          script_type: ansible
    name_and_pass: &id007
      states:
        available: any
      config:
        - name: rolename
          display_name: Role name
          type: string
          required: true
        - name: rolepass
          display_name: Role password
          type: password
          required: true
      scripts:
        - name: name_and_pass
          script: ./playbook.yaml
          script_type: ansible
    with_jinja: &id008
      allow_for_action_host_group: true
      states:
        available: any
      scripts:
        - name: with_jinja
          script: ./playbool.yaml
          script_type: ansible
      config_template:
        file:
          path: action.j2
        engine:
          type: jinja2
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: all_params
  version: 1.1
  import:
    very_complex:
      multibind: false
    for_export:
      multibind: false
  actions: *id003
  config: *id001
  components:
    all_params_component:
      actions:
        without_config_on_host:
          allow_for_action_host_group: false
          host_action: true
          states: *id002
          scripts:
            - name: without_config_on_host
              script: ./playbook.yaml
              script_type: ansible
        dummy: *id004
        with_config: *id005
        with_config_on_host: *id006
        name_and_pass: *id007
        with_jinja: *id008
      config: *id001
- type: service
  name: imports_with_defaults
  version: 4.3
  import:
    very_complex:
      multibind: false
      default:
        - plain_group
        - activatable_group
    for_export:
      multibind: true
      default:
        - another_stuff
  actions: *id003
  config:
    - name: just_integer
      type: integer
      default: 10000
    - name: plain_group
      type: group
      subs:
        - name: listofstuff
          type: list
          default:
            - o
            - o
            - p
    - name: activatable_group
      type: group
      activatable: true
      active: false
      subs:
        - name: simple
          type: string
          default: alsohere
    - name: another_stuff
      type: group
      subs:
        - name: hehe
          type: float
          default: 4.303
  components:
    just_component: null
