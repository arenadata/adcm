---
- type: cluster
  name: cluster_1
  version: '1.0'
  edition: community
  config_group_customization: true
  allow_maintenance_mode: true
  config: &id002
    - name: integer
      type: integer
      required: false
      default: 10
    - name: password
      type: password
      required: false
      default: password
    - name: string
      type: string
      required: false
      default: string
    - name: list
      type: list
      required: false
      default:
        - value1
        - value2
        - value3
  actions:
    action_on_cluster: &id003
      allow_in_maintenance_mode: true
      states: &id001
        available: any
      scripts:
        - name: action_on_cluster
          script: ./playbook.yaml
          script_type: ansible
    host_action_on_cluster: &id004
      host_action: true
      allow_in_maintenance_mode: true
      states:
        available: any
      scripts:
        - name: host_action_on_cluster
          script: ./playbook.yaml
          script_type: ansible
    hc_acl_action_on_cluster: &id005
      hc_acl:
        - service: service_two_components
          component: component_1
          action: add
        - service: service_two_components
          component: component_1
          action: remove
        - service: service_two_components
          component: component_2
          action: add
        - service: service_two_components
          component: component_2
          action: remove
      allow_in_maintenance_mode: true
      states: *id001
      scripts:
        - name: hc_acl_action_on_cluster
          script: ./playbook.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- name: service_one_component
  type: service
  version: '1.0'
  config: *id002
  actions:
    action_on_service: *id003
    host_action_on_service: *id004
  components:
    component_1:
      constraint:
        - 0
        - +
      config: *id002
      actions:
        action_on_component: *id003
        host_action_on_component: *id004
- name: service_two_components
  type: service
  version: '1.0'
  config: *id002
  actions:
    action_on_service: *id003
    hc_acl_action_on_service: *id005
    host_action_on_service: *id004
  components:
    component_1:
      constraint:
        - 0
        - +
      config: *id002
      actions:
        action_on_component_1: *id003
        host_action_on_component_1: *id004
        hc_acl_action_on_component_1: *id005
    component_2:
      constraint:
        - 0
        - +
      config: *id002
      actions:
        action_on_component_2: *id003
        host_action_on_component_2: *id004
        hc_acl_action_on_component_2: *id005
- name: another_service_two_components
  type: service
  version: '1.0'
  config: *id002
  actions: &id006
    action_on_service: *id003
  components: &id007
    component_1:
      constraint:
        - 0
        - +
      config: *id002
      actions:
        action_on_component_1: *id003
    component_2:
      constraint:
        - 0
        - +
      config: *id002
      actions:
        action_on_component_2: *id003
- name: another_service_two_components_2
  components:
    component_1:
      constraint:
        - 0
        - +
      config:
        - name: integer
          type: integer
          required: false
          default: 10
        - name: plain
          type: file
          default: ./plain.txt
        - name: secte
          type: secretfile
          default: ./secret.txt
        - name: bunch
          type: group
          subs:
            - name: plain
              type: file
              default: ./plain.txt
            - name: secte
              type: secretfile
              default: ./secret.txt
      actions:
        action_on_component_1: *id003
    component_2:
      constraint:
        - 0
        - +
      config: *id002
      actions:
        action_on_component_2: *id003
  type: service
  version: '1.0'
  config: *id002
  actions: *id006
- name: another_service_two_components_3
  type: service
  version: '1.0'
  config: *id002
  actions: *id006
  components: *id007
- name: with_hc_acl_actions
  version: 3.2
  type: service
  actions:
    with_hc:
      states:
        available: any
      display_name: I have HC-ACL section, I'm the best
      hc_acl:
        - service: service_one_component
          component: component_1
          action: add
        - service: service_two_components
          component: component_2
          action: remove
      scripts:
        - name: with_hc
          script: ./run.yaml
          script_type: ansible
