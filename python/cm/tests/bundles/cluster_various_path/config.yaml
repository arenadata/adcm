---
- type: cluster
  version: 4.3
  name: lots_of_places
  actions: &id001
    job_proto_relative:
      masking: null
      scripts:
        - name: job_proto_relative
          script: ./in_here.yaml
          script_type: ansible
    job_bundle_relative:
      masking: null
      scripts:
        - name: job_bundle_relative
          script: scripts/over_there.yaml
          script_type: ansible
    task_mixed:
      masking: null
      scripts:
        - name: proto_relative
          script: ./in_here.yaml
          script_type: ansible
        - name: bundle_relative
          script: scripts/over_there.yaml
          script_type: ansible
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: as_cluster
  version: 3.2
  actions: *id001
