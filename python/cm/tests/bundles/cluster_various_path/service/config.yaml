---
- type: service
  name: another_service
  version: 2.1
  actions: &id001
    job_proto_relative:
      masking: null
      scripts:
        - name: job_proto_relative
          script: ./in_here.yaml
          script_type: ansible
    job_bundle_relative:
      masking: null
      scripts:
        - name: job_bundle_relative
          script: scripts/over_there.yaml
          script_type: ansible
    task_mixed:
      masking: null
      scripts:
        - name: proto_relative
          script: ./scripts/over_there.yaml
          script_type: ansible
        - name: bundle_relative
          script: scripts/over_there.yaml
          script_type: ansible
  components:
    another_comp:
      actions: *id001
