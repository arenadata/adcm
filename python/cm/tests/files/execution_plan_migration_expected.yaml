            script: {type: python, path: ./scripts/check.py, params: null}
            on_fail: {state: null, multi_state_set: [], multi_state_unset: []}
            details: {terminatable: false}
      spec_keys: [/0-prepare, /1-install, /2-health_check]

    failed_internal_task:
      execution_plan:
        version: 1
        hierarchy: {rule: sequential, fields: ["0-add_hosts", "1-apply_mapping", "2-switch"], child_groups: {}}
        groups: {}
        scripts:
          /0-add_hosts:
            key: /0-add_hosts
