---
- type: cluster
  name: with_config
  version: 3
  actions: &id001
    dummy:
      masking: null
      scripts:
        - name: dummy
          script: ./playbook.yaml
          script_type: ansible
    on_host:
      host_action: true
      masking: null
      scripts:
        - name: on_host
          script: ./playbook.yaml
          script_type: ansible
  config: &id002
    - name: plain_s
      type: string
      default: '4'
    - name: plain_i
      type: integer
      default: 3
    - name: g1
      type: group
      subs:
        - name: plain_s
          type: string
          default: inside of group
        - name: records
          type: list
          required: false
        - name: group_b
          type: boolean
          default: false
    - name: ag1
      type: group
      activatable: true
      active: false
      subs:
        - name: kv_pairs
          type: map
          required: false
        - name: records
          type: list
          default:
            - first
            - sec:ond
    - name: ag2
      type: group
      activatable: true
      active: true
      subs:
        - name: sec1
          type: password
          required: false
        - name: sec2
          type: secretmap
          default:
            k1: v1
  contract_version: '2.1'
  venv: '2.16'
- type: service
  name: service_1
  version: 2
  actions: *id001
  config: *id002
  components: &id003
    component_1:
      actions: *id001
      config: *id002
    component_2:
      actions: *id001
- name: service_2
  type: service
  version: 2
  actions: *id001
  config: *id002
  components: *id003
