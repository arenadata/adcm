---
- type: provider
  name: simple_provider
  version: 3
  actions: &id001
    dummy:
      masking: null
      scripts:
        - name: dummy
          script: ./playbook.yaml
          script_type: ansible
  config: &id002
    - name: ip
      type: string
      default: 127.0.0.1
    - name: inside
      type: group
      subs:
        - name: simple_secret
          type: password
          required: false
        - name: complex_secret
          type: secrettext
          required: false
  contract_version: '2.1'
  venv: '2.16'
- type: host
  name: host
  version: 2
  actions: *id001
  config: *id002
