- type: provider
  name: revert_provider
  version: "2.0"
  contract_version: "2.1"
  venv: "2.16"
  upgrade:
    - name: api
      versions: &versions
        min: "1.0"
        max: "1.0"
      states:
        available: any
    - name: task
      versions: *versions
      states:
        available: any
      scripts: &switch_only
        - name: switch
          script: bundle_switch
          script_type: internal
    - name: api_with_state
      versions: *versions
      states:
        available: any
        on_success: upgraded
    - name: task_with_state
      versions: *versions
      states:
        available: any
        on_success: upgraded
      scripts: *switch_only
  actions:
    revert_upgrade:
      scripts:
        - name: revert
          script: bundle_revert
          script_type: internal
      states:
        available: any
  config:
    - name: kept
      type: string
      default: provider-kept
    - name: added
      type: string
      default: provider-added

- type: host
  name: revert_host
  version: "2.0"
  config:
    - name: kept
      type: string
      default: host-kept
    - name: added
      type: string
      default: host-added
