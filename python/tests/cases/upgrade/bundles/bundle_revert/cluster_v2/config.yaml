- type: cluster
  name: revert_cluster
  version: "2.0"
  contract_version: "2.1"
  venv: "2.16"
  config_group_customization: true
  import:
    exporter:
      versions:
        min: "1.0"
        max: "1.0"
  upgrade:
    - name: api
      versions:
        min: "1.0"
        max: "1.0"
      states:
        available: any
        on_success: upgraded
  actions:
    revert_upgrade:
      scripts:
        - name: revert
          script: bundle_revert
          script_type: internal
      states:
        available: any
  config:
    - name: kept
      type: string
      default: cluster-kept
    - name: added
      type: string
      default: cluster-added

- type: service
  name: service_kept
  version: "2.0"
  config:
    - name: kept
      type: string
      default: service-kept
    - name: added
      type: string
      default: service-added
  components:
    component_kept:
      config:
        - name: kept
          type: string
          default: component-kept
    component_added:

- type: service
  name: service_without_config
  version: "2.0"
  config:
    - name: added
      type: string
      default: service-gains-config

- type: service
  name: service_v2_only
  version: "2.0"
  components:
    component_of_v2_only:
