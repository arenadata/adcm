- type: cluster
  name: switch_cluster
  version: "2.0"
  contract_version: "2.1"
  venv: "2.16"
  allow_maintenance_mode: true
  config_group_customization: true
  import:
    exporter:
      versions:
        min: "1.0"
        max: "1.0"
  upgrade:
    - name: api
      versions: &versions
        min: "1.0"
        max: "1.0"
      states:
        available: any
    - name: task
      versions: *versions
      states:
        available: any
      scripts: &switch_only
        - name: switch
          script: bundle_switch
          script_type: internal
    - name: api_with_state
      versions: *versions
      states:
        available: any
        on_success: upgraded
    - name: task_with_state
      versions: *versions
      states:
        available: any
        on_success: upgraded
      scripts: *switch_only
  config:
    - name: kept
      type: string
      default: cluster-kept
    - name: added
      type: string
      default: cluster-added

- type: service
  name: service_kept
  version: "2.0"
  config:
    - name: kept
      type: string
      default: service-kept
    - name: added
      type: string
      default: service-added
  components:
    component_kept:
      config:
        - name: kept
          type: string
          default: component-kept
    component_added:
      config:
        - name: added
          type: string
          default: component-added

- type: service
  name: service_gains_config
  version: "2.0"
  config:
    - name: added
      type: string
      default: service-gains-config

- type: service
  name: service_without_config
  version: "2.0"
