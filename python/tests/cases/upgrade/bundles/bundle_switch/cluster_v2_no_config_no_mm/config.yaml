- type: cluster
  name: switch_cluster
  version: "2.1"
  contract_version: "2.1"
  venv: "2.16"
  allow_maintenance_mode: false
  upgrade:
    - name: api
      versions: &versions
        min: "1.0"
        max: "1.0"
      states:
        available: any
    - name: task
      versions: *versions
      states:
        available: any
      scripts:
        - name: switch
          script: bundle_switch
          script_type: internal
