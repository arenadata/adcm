# Bundle uploaded by G1.17: "Common Action" shared with other bundles' business role, "F Action" of its own
- type: cluster
  name: rbac_cluster_f
  version: "1.0"
  contract_version: "2.1"
  venv: "2.16"
  actions:
    common:
      display_name: Common Action
      masking:
      scripts: &scripts
