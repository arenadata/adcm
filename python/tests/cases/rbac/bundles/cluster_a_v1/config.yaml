# S-B1: cluster bundle A v1. "Common Action" and host actions on every cluster level, config everywhere, CHG allowed.
# Cluster actions changing topology during a task: `hc_finalize` (mapping set by finalizer), `hc_apply`, `add_spare`.
# `svc_spare` is never added in setup
- type: cluster
  name: rbac_cluster_a
  version: "1.0"
  contract_version: "2.1"
  venv: "2.16"
  config_group_customization: true
  config: &config
    - name: value
      type: string
      default: initial
  actions:
    common: &common
      display_name: Common Action
      masking:
      scripts: &scripts
        - name: run
          script_type: ansible
          script: ./playbook.yaml
    on_host: &on_host
      display_name: Run On Host
      host_action: true
      masking:
      scripts: *scripts
    in_ahg: &in_ahg
      display_name: AHG Action
      allow_for_action_host_group: true
      masking:
      scripts: *scripts
    removed:
      display_name: Removed Action
      masking:
      scripts: *scripts
    hc_finalize:
      display_name: HC Finalize
      masking:
      scripts: *scripts
      hc_acl: &hc_acl
        - service: svc_1
          component: comp_2
          action: add
        - service: svc_1
          component: comp_2
          action: remove
    hc_apply:
      display_name: HC Apply
      masking:
      scripts:
        - name: run
          script_type: ansible
          script: ./playbook.yaml
        - name: apply
          script_type: internal
          script: hc_apply
      hc_acl: *hc_acl
    add_spare:
      display_name: Add Spare
      masking:
      scripts:
        - name: add
          script_type: internal
          script: service_manage
          params:
            operation: add
            services:
              - name: svc_spare

- type: service
  name: svc_1
  version: "1.0"
  config_group_customization: true
  config: *config
  actions: &service_actions
    common: *common
    on_host: *on_host
    in_ahg: *in_ahg
  components: &components
    comp_1: &component
      config_group_customization: true
      config: *config
      actions:
        common: *common
        on_host: *on_host
        in_ahg: *in_ahg
    comp_2: *component

- type: service
  name: svc_2
  version: "1.0"
  config_group_customization: true
  config: *config
  actions: *service_actions
  components: *components

- type: service
  name: svc_3
  version: "1.0"
  config_group_customization: true
  config: *config
  actions: *service_actions
  components: *components

- type: service
  name: svc_spare
  version: "1.0"
  components:
    comp_1:
