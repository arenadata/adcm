# multi-state changes on failure of a script are rejected at any depth of groups
- type: cluster
  name: script_groups_cluster
  version: "2"
  contract_version: "2.1"
  venv: "2.21"

  upgrade:
    - name: grouped_upgrade
      versions:
        min: "1"
        max: "1"
      states:
        available: any
      scripts:
        - group: parallel
          name: branches
          scripts:
            - group: sequential
              name: inner
              scripts:
                - name: unflagging
                  script_type: ansible
                  script: ./playbook.yaml
                  on_fail:
                    state: branch_failed
                    multi_state:
                      unset: [branch_failed_flag]
            - name: plain
              script_type: ansible
              script: ./playbook.yaml

        - name: switch
          script_type: internal
          script: bundle_switch
