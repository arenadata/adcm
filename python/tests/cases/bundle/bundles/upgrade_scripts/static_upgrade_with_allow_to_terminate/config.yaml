- type: cluster
  name: upgrade_scripts_cluster
  version: "2"
  contract_version: "2.1"
  venv: "2.16"
  upgrade:
    - name: upgrade
      versions:
        min: "1"
        max: "1"
      states:
        available: any
      allow_to_terminate: true
      scripts:
        - name: run
          script_type: ansible
          script: ./playbook.yaml
        - name: switch
          script_type: internal
          script: bundle_switch
