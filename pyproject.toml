[tool.poetry]
name = "adcm"
version = "2.0.0"
description = "Arenadata Cluster Manager"
authors = [""]
readme = "README.md"

[tool.poetry.dependencies]
python = "~3.10"
# Django
django = "^5.2.7"
django-auth-ldap = "^5.2.0"
django-cors-headers = "^4.8.0"
django-csp = "^4.0"
django-filter = "^25.1"
django-guardian = "^3.1.3"
social-auth-app-django = "^5.5.1"

# DRF
# concerning our way of defining serializers, so we'd have to adopt code to update to 3.15
# we've decided to keep it at 3.14.0, since 3.15.0 introduced unwanted behavior
# update: Check the functionality of the latest version.
djangorestframework = "3.14.0"
djangorestframework-camel-case = "^1.4.2"
drf-nested-routers = "^0.94.0"  # drf-nested-routers (0.95.0) depends on djangorestframework (>=3.15.0)
drf-spectacular = { extras = ["sidecar"], version = "^0.28.0" }

# Extras
adcm-version = "2.0.0" # to compare bundle versions
pydantic = "^2.11.7"
psycopg = { extras = ["binary"], version = "^3.2.10" }
ruyaml = "^0.91.0"
python-gnupg = "^0.5.5"  # for the bundle signature verification mechanism
dishka = "^1.7.2"
hvac = "^2.3.0"  # vault integration

# Ansible
ansible = { git = "https://github.com/arenadata/ansible.git", rev = "v2.8.8-p8" }
jinja2 = "<3.0.0"  # required for Ansible for jinja_native option,
# "<3.0.0" is due to the absence of the "jinja2._compat" module in jinja2 >= 3.0.0.
# Jinja2 is also used for rendering files in ADCM.
markupsafe = "<2.1"  # required for jinja2,
# "<2.1" is due to the absence of the "soft_unicode()" function in markupsafe >= 2.1,
# but which is used in jinja2 < 3.0.0
pydantic-settings = "^2.13.0"

[tool.poetry.group.ansible.dependencies]
# hvac was moved to main dependencies in order to support vault secrets storage
# yet it's required by bundle developers
# hvac = "^2.3.0"  # required for hashi_vault plugin
jmespath = "1.0.1"  # required for community.general.json_query filter
grpcio = "^1.75.0"  # required for YCC bundle
lxml = "^6.0.2"  # required for `yarn_scheduler_jmx` custom filter

[tool.poetry.group.celery.dependencies]
celery = "5.5.3"
# required for kombu to manage celery tasks in DB
sqlalchemy = "2.0.39"

[tool.poetry.group.lint]
optional = true

[tool.poetry.group.lint.dependencies]
ruff = "^0.1.13"
pyright = "^1.1.378"
import-linter = "^2.5"
django-stubs = "^5.0.4"
djangorestframework-stubs = "^3.15.0"

[tool.poetry.group.unittests]
optional = true

[tool.poetry.group.unittests.dependencies]
tblib = "^2.0.0"
django-test-migrations = "^1.3.0"
faker = "^40.11.0"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pre-commit = "^3.6.0"

[tool.poetry.group.profiling]
optional = true

[tool.poetry.group.profiling.dependencies]
django-silk = "^5.0.4"
django-debug-toolbar = "^5.0.1"

[tool.poetry.group.run]
optional = true

[tool.poetry.group.run.dependencies]
uwsgi = "^2.0.30"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
exclude = [
    "python/core/tests/test_templates/files/python/incorrect.py",
    "python/api_v2/tests/bundles/render_errors/templates/syntax_error.py",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
length-sort-straight = true
order-by-type = true

[tool.ruff.lint.per-file-ignores]
# Those rules are inadequate for migrations
# ARG001 - for python code it's common for arguments not to be used
# N803 - variables are in uppercase, because those are models
# N999 - we already have incorrect module names, won't be easy to rework
"python/cm/migrations/*" = ["ARG001", "N806", "N999"]
"python/audit/migrations/*" = ["ARG001", "N806", "N999"]
"python/rbac/migrations/*" = ["ARG001", "N806", "N999"]
# Hooks must implement specific interface, and it's visually convenient to name them as funcitons.
# ARG001 - interface implementations may not use all arguments required by that interface
# N801 - hooks that inherits from convenient class are also classes, but should be percieved as functions
"python/audit/alt/hooks.py" = ["ARG001", "N801"]

[tool.ruff.lint]
ignore = [
    "E402",
    "SIM117",
    "A003",
    "ANN001", "ANN201", "ANN101", "ANN102", "ANN401", "ANN002", "ANN003", "ANN202", "ANN204", "ANN205", "ANN206",
    "COM812",
    "ARG005",
    "S105",
    "TRY003", "TRY201", "TRY301", "TRY300",
    "S106",
    "RET503", "RET505",
    "FBT001", "FBT002", "FBT003",
    "PIE800",
    "PTH103", "PTH107", "PTH110", "PTH112", "PTH118", "PTH119", "PTH120", "PTH123",
    "S107"
]
select = [
    # Pyflakes
    "F",
    # Pycodestyle
    "E", "W",
    # isort
    "I",
    # "COM" - The following rules may cause conflicts when used with the formatter: `COM812`.
    # To avoid unexpected behavior, we recommend disabling these rules
    "N", "UP", "YTT", "ANN",
    "S", "BLE", "FBT", "B", "COM", "A", "C4",
    "DTZ", "ICN", "PIE", "Q", "RET",
    "SIM", "ARG", "PTH", "PLE", "TRY"
]

[tool.pyright]
include = [
    "python",
    "dev/linters",
    "conf/adcm/python_scripts",
]
exclude = [
    # cm
    "python/cm/collect_statistics/",
    "python/cm/legacy/",
    "python/cm/management/",
    "python/cm/migrations",
    "python/cm/models.py",
    "python/cm/errors.py",
    "python/cm/signals.py",
    "python/cm/lookups.py",
    # rbac
    "python/rbac/",
    # audit
    "python/audit/",
    # other
    "conf/adcm/",
    "dev/linters/",
    "python/adcm/",
    "python/ansible_plugin/",
    "python/ansible_share/",
    "python/api_v2/",
    "python/jobs/",
    # common
    "**/tests",
    # technical
    "**/__pycache__",
]

typeCheckingMode = "standard"
reportUnnecessaryTypeIgnoreComment = true

reportMissingImports = "error"
reportMissingTypeStubs = false

pythonVersion = "3.10"
pythonPlatform = "Linux"

executionEnvironments = [
    { root = "python" },
    { root = "conf/adcm/python_scripts", extraPaths = ["python"] },
]

[tool.importlinter]
# The main package to lint
root_packages = [
    "adcm",
    "ansible_plugin",
    "api_v2",
    "application",
    "audit",
    "cm",
    "core",
    "infra",
    "integrations",
    "jobs",
    "rbac",
    "use_cases",
]

# Only check imports within the project, not external libs
include_external_packages = true

#[[tool.importlinter.contracts]]
#name = "ADCM layers contract"
#type = "layers"
# Semi correct layers are below:
# after refactoring following rules should be enabled again (ADCM-7181, ADCM-7182, ADCM-7183)
#layers = [
#    "api_v2 | jobs | ansible_plugin",
#    "use_cases | application",
#    # this should be done with "|", but requires quite a refactoring for true independance
#    "cm : audit : rbac",
#    "core",
#]

[[tool.importlinter.contracts]]
name = "core layers contract"
type = "layers"
layers = [
    # it's not actually top layer, but we don't want it to poison other core modules
    "core.legacy",
    "core.scenarios",
    "core.bundle",
    "core.action",
    # core.upgrade may be moved later if required
    "core.config | core.mapping | core.cluster | core.provider | core.upgrade | core.logs",
    "core.templates | core.secrets",
    "core.errors | core.settings",
    "core.types",
    "core.result",
]

[[tool.importlinter.contracts]]
name = "core must not import other modules"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["cm", "rbac", "api_v2", "ansible_share", "ansible_plugin", "audit", "jobs", "django", "use_cases", "infra", "application", "integrations"]

[[tool.importlinter.contracts]]
name = "core.* modules must not import core.bundle"
type = "forbidden"
source_modules = ["core.*"]
forbidden_submodules = ["core.legacy.bundle"]
forbidden_modules = []
